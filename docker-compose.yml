services:
  app:
    build:
      context: ./docker/php
    container_name: mvp-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      # vendor NO se mapea a un volumen aparte: un volumen anidado dentro de
      # este bind mount puede quedar en un estado en el que el propio punto
      # de montaje no se puede borrar ("could not delete .../vendor") en un
      # clon nuevo, tanto en Windows como en Linux. Composer usa este mismo
      # ./app, así que vendor es un directorio normal dentro del bind mount.
      - ./app:/var/www/html
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mvp

  nginx:
    image: nginx:alpine
    container_name: mvp-nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT}:80"
    volumes:
      - ./app:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - mvp

  postgres:
    image: postgres:18-alpine
    container_name: mvp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - ./volumes/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - mvp

networks:
  mvp:
    driver: bridge
